<title>Bench Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench Test">
<style>
/* ---------- tokens: dark-first workbench ---------- */
:root{
  color-scheme:dark;
  --ground:#0d1117; --surf:#151b23; --surf2:#1c242e; --surf3:#232d39;
  --line:#2a3440; --line2:#374453;
  --ink:#e8edf4; --ink2:#a8b3c1; --ink3:#6f7d8d;
  --gold:#e9a63f; --gold-dim:#8a6421; --gold-ink:#1a1206;
  --ok:#3fbf80; --ok-dim:#1c3f2e;
  --bad:#ff5c63; --bad-dim:#4a1f25;
  --info:#5fa8e8;
  --shadow:0 -1px 0 var(--line), 0 -12px 28px rgba(0,0,0,.5);
  --r:11px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#f2f4f7; --surf:#ffffff; --surf2:#eef1f5; --surf3:#e4e9ef;
  --line:#d8dee7; --line2:#c3ccd8;
  --ink:#131922; --ink2:#4d5b6c; --ink3:#7b8797;
  --gold:#9a6708; --gold-dim:#e5cfa4; --gold-ink:#fffaf0;
  --ok:#12764c; --ok-dim:#d6f0e3;
  --bad:#c02631; --bad-dim:#fadde0;
  --info:#1d64a8;
  --shadow:0 -1px 0 var(--line), 0 -12px 28px rgba(30,40,55,.12);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#f2f4f7; --surf:#ffffff; --surf2:#eef1f5; --surf3:#e4e9ef;
    --line:#d8dee7; --line2:#c3ccd8;
    --ink:#131922; --ink2:#4d5b6c; --ink3:#7b8797;
    --gold:#9a6708; --gold-dim:#e5cfa4; --gold-ink:#fffaf0;
    --ok:#12764c; --ok-dim:#d6f0e3;
    --bad:#c02631; --bad-dim:#fadde0;
    --info:#1d64a8;
    --shadow:0 -1px 0 var(--line), 0 -12px 28px rgba(30,40,55,.12);
  }
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ---------- shell ---------- */
#app{max-width:680px;margin:0 auto;padding:0 18px;padding-block:14px 96px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.chip-logo{width:26px;height:26px;border-radius:6px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;flex:none}
.brand b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:17px;letter-spacing:.01em}
.brand span{color:var(--ink3);font-size:11px}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--ink2);flex:none;font-size:14px}
.icobtn:hover{border-color:var(--line2);color:var(--ink)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--ink3);font-size:10px;letter-spacing:.02em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--gold)}

/* ---------- surfaces ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stack{display:flex;flex-direction:column;gap:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.sec-h h2{font-size:15px;letter-spacing:.01em}

/* ---------- status readout ---------- */
.readout{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.readout-top{display:flex;gap:16px;align-items:center;padding:18px 16px}
.dial{position:relative;width:104px;height:104px;flex:none}
.dial svg{transform:rotate(-90deg);display:block}
.dial-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.dial-val b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:30px;line-height:1}
.dial-val small{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.rank{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:23px;line-height:1.15;margin-bottom:2px}
.rank-sub{color:var(--ink2);font-size:12.5px;line-height:1.45}
.readout-strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.strip-cell{padding:11px 8px 12px;text-align:center;border-left:1px solid var(--line)}
.strip-cell:first-child{border-left:none}
.strip-cell b{display:block;font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;line-height:1.2}
.strip-cell .eyebrow{margin-top:2px}

/* W/L bar */
.wl{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--surf3)}
.wl i{display:block;height:100%}
.wl .w{background:var(--ok)} .wl .l{background:var(--bad)}

/* ---------- domain meters ---------- */
.meter{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.meter:first-of-type{border-top:none}
.meter-name{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.meter-name em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink3);flex:none}
.meter-pct{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.meter-track{grid-column:1/-1;height:5px;border-radius:99px;background:var(--surf3);overflow:hidden}
.meter-fill{height:100%;border-radius:99px;transition:width .5s ease}
.meter-note{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}
.dot{width:6px;height:6px;border-radius:99px;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surf2);font-size:14px;font-weight:600;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- launcher tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 14px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.tile:hover{border-color:var(--gold)}
.tile b{font-size:14px;font-weight:600}
.tile p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.4}
.tile .tag{align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qprog{flex:1;height:4px;border-radius:99px;background:var(--surf3);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.pill{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3.5px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);background:var(--surf2)}
.pill.gold{color:var(--gold);border-color:var(--gold-dim)}
.qtext{font-size:17.5px;line-height:1.42;font-weight:500;margin:0 0 15px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-size:14.5px;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--surf2)}
.opt .key{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink3);flex:none;width:15px;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-dim)}
.opt.correct .key{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-dim)}
.opt.wrong .key{color:var(--bad)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}

.verdict{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;background:var(--surf);padding:13px 14px}
.verdict.good{border-left-color:var(--ok)}
.verdict.bad{border-left-color:var(--bad)}
.verdict h3{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.verdict p{margin:0 0 9px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.verdict p:last-of-type{margin-bottom:0}
.verdict .ex{background:var(--surf2);border-radius:8px;padding:10px 11px;font-size:12.5px;line-height:1.5;color:var(--ink2);margin-bottom:10px}
.verdict .ex b{color:var(--ink);font-weight:600}
.watch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--info);text-decoration:none;border-bottom:1px solid transparent}
.watch:hover{border-bottom-color:currentColor}

/* ---------- flashcards ---------- */
.fc{perspective:1200px;margin-bottom:13px}
.fc-in{position:relative;min-height:212px;border-radius:14px;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surf);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:9px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--surf2);text-align:left;justify-content:flex-start;overflow-y:auto}
.fc-term{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:27px;line-height:1.18}
.fc-hint{font-size:12px;color:var(--ink3)}
.fc-def{font-size:14.5px;line-height:1.55;color:var(--ink)}
.fc-ex{font-size:12.5px;line-height:1.5;color:var(--ink2);background:var(--ground);border-radius:8px;padding:9px 10px}

/* speed round */
.speed{text-align:center;padding:26px 16px}
.speed-clock{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1}
.speed-term{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:26px;line-height:1.2;margin:16px 0 6px}

/* ---------- exam ---------- */
.exam-hud{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -18px 14px;padding:10px 18px;display:flex;align-items:center;gap:12px}
.exam-clock{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.exam-clock.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.qcell{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surf);font-family:"IBM Plex Mono",monospace;font-size:11.5px;display:grid;place-items:center;color:var(--ink3)}
.qcell.done{background:var(--surf3);color:var(--ink);border-color:var(--line2)}
.qcell.flag{border-color:var(--gold);color:var(--gold)}
.qcell.cur{outline:2px solid var(--gold);outline-offset:1px}

.score-big{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:56px;line-height:1;letter-spacing:-.02em}
.verdict-pass{color:var(--ok)} .verdict-fail{color:var(--bad)}

/* ---------- PBQ ---------- */
.pbq-pool{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px dashed var(--line2);border-radius:10px;background:var(--surf2);min-height:52px;align-content:flex-start}
.chipdrag{padding:8px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);font-size:13px;cursor:grab;user-select:none;touch-action:none;line-height:1.3}
.chipdrag.picked{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.slot{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surf);min-height:46px}
.slot.armed{border-color:var(--gold);border-style:dashed}
.slot-n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);flex:none;width:20px}
.slot-label{font-size:12.5px;color:var(--ink2);flex:1;min-width:0}
.slot-val{font-size:13px;font-weight:500}
.slot.right{border-color:var(--ok);background:var(--ok-dim)}
.slot.wrongslot{border-color:var(--bad);background:var(--bad-dim)}

/* ---------- calendar heat ---------- */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surf3);display:block}
.heat i[data-l="1"]{background:var(--gold-dim)}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--gold) 55%,var(--gold-dim))}
.heat i[data-l="3"]{background:var(--gold)}
.heat i[data-today]{outline:1.5px solid var(--ink3);outline-offset:1px}

/* ---------- semesters ---------- */
.sem{border:1px solid var(--line);border-radius:var(--r);padding:13px;background:var(--surf)}
.sem.live{border-color:var(--gold-dim)}
.sem-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sem-h b{font-size:14.5px}
.rec{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:var(--surf2);font-size:12.5px;line-height:1.45;color:var(--ink2)}
.rec b{color:var(--ink);font-weight:600}
.rec-i{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-family:"IBM Plex Mono",monospace;font-weight:600}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:13.5px;line-height:1.6}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(3,6,10,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet-in{background:var(--surf);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;padding:18px;max-height:82vh;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.field input,.field select{background:var(--surf2);border:1px solid var(--line2);border-radius:9px;padding:10px 11px;color:var(--ink);font:inherit;font-size:14px;width:100%}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surf3);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surf3);border:1px solid var(--line2);color:var(--ink);padding:9px 15px;border-radius:99px;font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.syncdot{width:6px;height:6px;border-radius:99px;background:var(--ink3);flex:none}
.syncdot.on{background:var(--ok)}
@media (max-width:420px){
  .readout-top{gap:13px;padding:15px 13px}
  .dial{width:90px;height:90px}
  .dial-val b{font-size:26px}
  .rank{font-size:20px}
  #app{padding:0 14px;padding-block:12px 92px}
  .exam-hud{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
}
</style>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="chip-logo">A+</div>
      <div class="grow">
        <b>Bench Test</b><br>
        <span class="mono" id="coreLabel">CORE 1 + CORE 2 · V15</span>
      </div>
    </div>
    <div class="row" style="gap:7px">
      <span class="syncdot" id="syncDot" title="sync"></span>
      <button class="icobtn" id="btnSettings" aria-label="Settings">⚙</button>
    </div>
  </div>
  <div id="screen"></div>
</div>

<nav class="tabbar">
  <div class="tabbar-in" id="tabs"></div>
</nav>
