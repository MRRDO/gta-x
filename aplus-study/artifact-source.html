{i:"o04",d:"c2d1",o:"1.2",t:"sfc scannow system file checker",q:"Windows is behaving erratically and you suspect corrupted system files. Which command do you run first?",c:["sfc /scannow","chkdsk /r","diskpart clean","gpupdate /force"],a:0,w:"System File Checker verifies protected OS files against a known-good cache and repairs mismatches.",x:"If SFC cannot repair them, follow with: DISM /Online /Cleanup-Image /RestoreHealth, then run SFC again."},
{i:"o05",d:"c2d1",o:"1.2",t:"gpupdate gpresult group policy",q:"A new Group Policy was published but a domain workstation has not applied it. Which command forces it?",c:["gpupdate /force","gpresult /r","net use","sfc /scannow"],a:0,w:"gpupdate applies policy immediately; gpresult /r REPORTS which policies are currently applied.",x:"Troubleshooting flow: gpupdate /force, then gpresult /r to confirm the GPO actually landed on the machine."},
{i:"o06",d:"c2d1",o:"1.3",t:"Windows Task Manager",q:"Which tool shows real-time CPU, memory, disk, and network utilization plus which processes are consuming them?",c:["Task Manager","Device Manager","Disk Management","Event Viewer"],a:0,w:"Task Manager is the first stop for 'why is this machine slow'. Resource Monitor drills deeper into the same data.",x:"Sort by Disk in the Processes tab. On a slow machine with a mechanical drive, that column usually names the culprit instantly."},
{i:"o07",d:"c2d1",o:"1.3",t:"Windows Device Manager",q:"A device shows a yellow triangle with an exclamation point in Device Manager. What does that mean?",c:["The device is detected but has a driver or resource problem","The device is disabled","The device is working normally","The device is unplugged"],a:0,w:"Yellow warning = problem. A down-arrow icon = deliberately disabled. Nothing = healthy.",x:"Right-click > Properties shows a Code number. Code 28 means no driver is installed; Code 43 means the device reported a failure."},
{i:"o08",d:"c2d1",o:"1.4",t:"Windows Control Panel vs Settings",q:"Which Control Panel applet lets you configure how the system behaves when the lid is closed or the power button is pressed?",c:["Power Options","System","Devices and Printers","Ease of Access"],a:0,w:"Power Options owns sleep, hibernate, lid actions, and the balanced/high performance plans.",x:"Turning off Fast Startup here is a standard fix for laptops that will not fully shut down or that fail to dual-boot properly."},
{i:"o09",d:"c2d1",o:"1.5",t:"Windows file systems NTFS FAT32 exFAT",q:"You need a USB drive that stores files over 4 GB and works on both Windows and macOS. Which file system?",c:["exFAT","FAT32","NTFS","ext4"],a:0,w:"FAT32 caps individual files at 4 GB. NTFS is read-only on macOS by default. exFAT is the cross-platform compromise with no practical file size limit.",x:"Trying to copy a 6 GB video to a FAT32 stick throws 'file too large' even though the drive shows 50 GB free. That is the 4 GB cap, not a space problem."},
{i:"o10",d:"c2d1",o:"1.5",t:"NTFS permissions vs share permissions",q:"A user has Full Control on the share but Read on NTFS. What is their effective permission over the network?",c:["Read — the most restrictive of the two wins","Full Control","Modify","No access"],a:0,w:"When share and NTFS permissions combine, the more restrictive one is the effective permission across the network.",x:"Best practice: set the share to Full Control for Authenticated Users and do all real access control in NTFS, where it also applies locally."},
{i:"o11",d:"c2d1",o:"1.6",t:"Windows installation clean vs in-place upgrade",q:"Which installation type wipes the partition and installs a fresh copy of Windows?",c:["Clean install","In-place upgrade","Repair install","Refresh"],a:0,w:"A clean install removes everything. An in-place upgrade keeps files, settings, and most applications.",x:"When persistent malware or deep OS corruption is the issue, a clean install is the only reliable answer — an upgrade carries the problem forward."},
{i:"o12",d:"c2d1",o:"1.6",t:"MBR vs GPT partitioning",q:"Which partition scheme supports drives larger than 2 TB and more than four primary partitions?",c:["GPT","MBR","FAT","Dynamic disk"],a:0,w:"MBR caps at 2 TB and four primary partitions. GPT supports far larger drives and up to 128 partitions, and pairs with UEFI boot.",x:"UEFI + Secure Boot requires GPT. Trying to install Windows 11 to an MBR disk in UEFI mode throws 'Windows cannot be installed to this disk'."},
{i:"o13",d:"c2d1",o:"1.8",t:"macOS Time Machine",q:"Which macOS feature performs automated incremental backups to an external or network volume?",c:["Time Machine","Disk Utility","Mission Control","Keychain"],a:0,w:"Time Machine keeps hourly, daily, and weekly snapshots and lets you restore individual files or a whole system.",x:"Disk Utility is the partition and repair tool; Keychain stores credentials; Mission Control manages windows and Spaces."},
{i:"o14",d:"c2d1",o:"1.8",t:"macOS Spotlight Finder",q:"What is Finder on macOS equivalent to on Windows?",c:["File Explorer","Task Manager","Control Panel","Registry Editor"],a:0,w:"Finder is the macOS file browser. Activity Monitor is the Task Manager equivalent; System Settings maps to Control Panel.",x:"Spotlight (Cmd + Space) is the fastest way to launch anything on a Mac — the rough equivalent of the Windows key search box."},
{i:"o15",d:"c2d1",o:"1.9",t:"Linux commands chmod",q:"Which Linux command changes file permissions?",c:["chmod","chown","ls -l","pwd"],a:0,w:"chmod changes the permission bits. chown changes the owning user and group.",x:"chmod 755 file gives owner read/write/execute (7) and group and others read/execute (5). Read=4, Write=2, Execute=1."},
{i:"o16",d:"c2d1",o:"1.9",t:"Linux sudo apt commands",q:"Which command installs software on a Debian or Ubuntu system?",c:["sudo apt install <package>","yum install <package>","chmod +x <package>","grep <package>"],a:0,w:"apt is the Debian/Ubuntu package manager; yum and dnf belong to Red Hat, Fedora, and CentOS.",x:"sudo raises privileges for one command. On the exam, apt = Debian family, dnf/yum = Red Hat family."},
{i:"o17",d:"c2d1",o:"1.9",t:"Linux grep command",q:"What does grep do?",c:["Searches text or files for lines matching a pattern","Changes directories","Copies files","Displays disk usage"],a:0,w:"grep filters text by pattern and is the backbone of log analysis on Linux.",x:"grep -i error /var/log/syslog pulls every line containing 'error' regardless of case. Add -r to search a whole directory tree."},
{i:"o18",d:"c2d1",o:"1.3",t:"Windows Event Viewer logs",q:"Which tool would you use to review Windows system, application, and security logs after an unexplained crash?",c:["Event Viewer","Performance Monitor","Task Scheduler","Registry Editor"],a:0,w:"Event Viewer holds the logs. Critical and Error entries around the crash timestamp are where you start.",x:"Event ID 41 in the System log ('Kernel-Power') means the machine lost power or hard-locked without a clean shutdown."},
{i:"o19",d:"c2d1",o:"1.3",t:"msconfig startup programs",q:"Where do you disable programs that launch automatically at Windows startup?",c:["Task Manager's Startup tab","Device Manager","Disk Cleanup","Windows Defender"],a:0,w:"Startup management moved from msconfig into Task Manager starting in Windows 8. msconfig still handles boot options and services.",x:"The 'Startup impact' column ranks which entries are actually costing you boot time, so you disable the right ones."},
{i:"o20",d:"c2d1",o:"1.4",t:"Windows Defender Firewall",q:"A line-of-business app cannot receive inbound connections after an update. Which Control Panel item do you check?",c:["Windows Defender Firewall — inbound rules","Internet Options","Programs and Features","Indexing Options"],a:0,w:"An app update can change the executable path, which invalidates the old firewall rule and silently blocks it.",x:"Check the rule's Program path against the actual .exe location. Also confirm the rule is enabled for the right profile — Domain, Private, or Public."},
{i:"o21",d:"c2d1",o:"1.7",t:"Windows domain vs workgroup",q:"What is the main difference between a Windows domain and a workgroup?",c:["A domain uses centralized authentication and policy from a domain controller; a workgroup has per-machine local accounts","A workgroup supports more computers","A domain requires Windows Home","A workgroup uses Active Directory"],a:0,w:"Domains centralize identity, policy, and management. Workgroups are peer-to-peer with independent local accounts on every machine.",x:"In a 40-person workgroup a password change means touching 40 machines. In a domain it is one change in Active Directory."},
{i:"o22",d:"c2d1",o:"1.7",t:"mapped network drive",q:"Which command maps a network share to drive letter Z on Windows?",c:["net use Z: \\\\server\\share","net share Z:","map Z: server","mount Z: //server/share"],a:0,w:"net use is the command-line way to map, disconnect, and list network drives.",x:"Add /persistent:yes so the mapping survives a reboot. Add /user:DOMAIN\\name to authenticate as a different account."},
{i:"o23",d:"c2d1",o:"1.6",t:"Windows recovery environment",q:"A Windows PC will not boot past the logo. Which recovery option lets you undo a recent driver or update by returning the system to an earlier configuration?",c:["System Restore from the Windows Recovery Environment","Reset this PC","Startup Repair","Disk Cleanup"],a:0,w:"System Restore rolls back system files, registry, and drivers to a restore point while leaving personal files alone.",x:"Reset this PC is heavier — it reinstalls Windows, optionally keeping personal files but removing all applications."},
{i:"o24",d:"c2d1",o:"1.5",t:"file attributes hidden read only",q:"Which Windows command displays and changes file attributes such as hidden, read-only, and system?",c:["attrib","dir /w","icacls","robocopy"],a:0,w:"attrib +h hides a file, attrib -r clears read-only. icacls handles NTFS permissions, which are a different thing entirely.",x:"Malware often sets +h +s on files so they stay invisible even when 'show hidden files' is enabled. attrib -h -s reveals them."},
{i:"o25",d:"c2d1",o:"1.2",t:"diskpart command",q:"Which command-line utility creates, deletes, and formats partitions in Windows?",c:["diskpart","chkdsk","format","fdisk"],a:0,w:"diskpart is the interactive partition tool. fdisk is the Linux equivalent, not a Windows command.",x:"diskpart > list disk > select disk 1 > clean wipes the partition table. Select the wrong disk number and you just erased the wrong drive — read twice."},
{i:"o26",d:"c2d1",o:"1.9",t:"Linux dd command",q:"What does the Linux dd command do?",c:["Copies and converts data block by block, commonly used to image drives or write ISOs to USB","Deletes directories","Displays disk usage","Downloads files"],a:0,w:"dd works at the block level, which makes it powerful for imaging and dangerous for typos.",x:"dd if=image.iso of=/dev/sdb bs=4M writes an ISO to a USB stick. Point 'of=' at the wrong device and you overwrite your system drive with no confirmation."},
{i:"o27",d:"c2d1",o:"1.1",t:"32-bit vs 64-bit operating system",q:"What is the practical RAM limit of a 32-bit version of Windows?",c:["About 4 GB","About 8 GB","16 GB","No limit"],a:0,w:"32-bit addressing tops out at 2^32 bytes = 4 GB, and usable memory is somewhat less after hardware reservations.",x:"Install 16 GB in a machine running 32-bit Windows and it will report roughly 3.2 GB usable. The fix is a 64-bit OS."},
{i:"o28",d:"c2d1",o:"1.4",t:"Windows Task Scheduler",q:"You need a script to run automatically every night at 2 AM on a Windows server. Which tool do you use?",c:["Task Scheduler","Event Viewer","Performance Monitor","Services"],a:0,w:"Task Scheduler runs programs on triggers: time, logon, startup, idle, or specific event log entries.",x:"Set 'Run whether user is logged on or not' or the task silently skips when nobody is signed in — the most common Task Scheduler gotcha."},

/* ---------- CORE 2 · 2.0 SECURITY ---------- */
{i:"s01",d:"c2d2",o:"2.1",t:"principle of least privilege",q:"Which principle says users get only the access their job requires and nothing more?",c:["Principle of least privilege","Defense in depth","Zero trust","Separation of duties"],a:0,w:"Least privilege limits the blast radius when an account is compromised or a user makes a mistake.",x:"An accountant does not need local admin. Strip it, and a phishing click can no longer install a service-level rootkit."},
{i:"s02",d:"c2d2",o:"2.2",t:"multifactor authentication factors",q:"Which pair is true multifactor authentication?",c:["A password plus a code from a hardware token","A password plus a PIN","A fingerprint plus a retina scan","Two different passwords"],a:0,w:"MFA requires factors from DIFFERENT categories: something you know, something you have, something you are.",x:"Password + PIN is two things you KNOW — same category, so it is not MFA. Password + phone app IS."},
{i:"s03",d:"c2d2",o:"2.3",t:"phishing social engineering",q:"An email appears to come from the CEO urgently asking an accountant to wire funds to a new vendor. What is this?",c:["Spear phishing / business email compromise","A DDoS attack","A zero-day exploit","A rootkit"],a:0,w:"Targeted, personalized, authority-driven, and urgent — spear phishing. Whaling is when the CEO is the target rather than the pretext.",x:"The defense is procedural, not technical: out-of-band verification. Call the CEO on a known number before any wire transfer."},
{i:"s04",d:"c2d2",o:"2.3",t:"tailgating piggybacking",q:"An unbadged person follows an employee through a secured door. What is this and what stops it?",c:["Tailgating — a mantrap/access control vestibule and security awareness training","Shoulder surfing — privacy screens","Phishing — email filtering","Dumpster diving — shredding"],a:0,w:"Tailgating is physical, so the controls are physical and procedural.",x:"An access control vestibule (mantrap) only lets one person through per credential, which makes tailgating physically impossible."},
{i:"s05",d:"c2d2",o:"2.3",t:"ransomware",q:"Files on a share are renamed with a strange extension and a text file demands cryptocurrency. What is the FIRST action?",c:["Disconnect the infected system from the network to stop it spreading","Pay the ransom","Run a full antivirus scan and continue working","Reboot the machine"],a:0,w:"CompTIA's malware removal steps start with quarantining the system. Containment before remediation, every time.",x:"Full order: investigate and verify, quarantine, disable System Restore, remediate (update definitions, scan in safe mode), schedule scans and updates, re-enable System Restore, educate the user."},
{i:"s06",d:"c2d2",o:"2.4",t:"BitLocker full disk encryption",q:"A company wants laptop data unreadable if a device is stolen. What do they deploy?",c:["BitLocker full disk encryption","A screensaver password","NTFS permissions","A BIOS password"],a:0,w:"Only encryption protects data when the attacker can pull the drive out and read it in another machine.",x:"NTFS permissions and BIOS passwords are trivially bypassed by mounting the disk elsewhere. BitLocker with TPM is not."},
{i:"s07",d:"c2d2",o:"2.4",t:"TPM chip",q:"What does a TPM do?",c:["Stores encryption keys in dedicated tamper-resistant hardware and measures boot integrity","Speeds up file compression","Provides a hardware firewall","Manages RAID arrays"],a:0,w:"The Trusted Platform Module holds keys off the disk and can seal them so they only release if the boot chain is unmodified.",x:"That is why BitLocker with TPM unlocks silently on a healthy boot but demands the recovery key after someone changes the firmware or moves the drive."},
{i:"s08",d:"c2d2",o:"2.5",t:"password best practices complexity",q:"Which password policy setting prevents users from cycling back to a favorite old password?",c:["Enforce password history","Minimum password length","Account lockout threshold","Maximum password age"],a:0,w:"Password history remembers previous hashes and blocks reuse. Pair it with minimum password AGE or users just change it repeatedly to get back.",x:"History of 24 plus a 1-day minimum age means a user cannot burn through 24 changes in an afternoon to reclaim their old password."},
{i:"s09",d:"c2d2",o:"2.5",t:"account lockout policy",q:"What does an account lockout threshold defend against?",c:["Brute-force and password-guessing attacks","Phishing emails","SQL injection","Physical theft"],a:0,w:"Locking after N failed attempts makes automated guessing impractically slow.",x:"Set it too aggressively (3 attempts, permanent lockout) and you create a self-inflicted denial of service every Monday morning."},
{i:"s10",d:"c2d2",o:"2.6",t:"data destruction methods degaussing",q:"A stack of failed magnetic hard drives holding sensitive data must be destroyed. Which method is appropriate?",c:["Degaussing, shredding, or incineration","Quick format","Deleting the partitions","Moving files to the recycle bin"],a:0,w:"Physical destruction or degaussing is required for sensitive magnetic media. Formatting and deleting only clear pointers.",x:"Degaussing does NOT work on SSDs — there is no magnetic domain to scramble. SSDs need crypto-erase or physical shredding."},
{i:"s11",d:"c2d2",o:"2.6",t:"certificate of destruction",q:"After a third party destroys your retired drives, what should you obtain for compliance?",c:["A certificate of destruction","A purchase order","A warranty claim","An asset tag"],a:0,w:"The certificate documents what was destroyed, how, and when — the audit trail regulators ask for.",x:"Under HIPAA or PCI DSS, 'we sent them off somewhere' is not a defense. The certificate is."},
{i:"s12",d:"c2d2",o:"2.7",t:"SOHO router default credentials",q:"What is the first thing you should change when deploying a new SOHO router?",c:["The default administrator username and password","The SSID color scheme","The DNS server","The firmware language"],a:0,w:"Default credentials are published online for every model. Leaving them is the single most exploited SOHO weakness.",x:"Follow it with: update firmware, disable WPS, enable WPA3, and turn off remote WAN management."},
{i:"s13",d:"c2d2",o:"2.7",t:"disable SSID broadcast guest network",q:"Which statement about hiding the SSID is accurate?",c:["It is a weak deterrent only — the network name still appears in client probe requests and management frames","It fully secures the network","It encrypts the traffic","It prevents brute-force attacks"],a:0,w:"SSID hiding is security through obscurity. Any wireless analyzer sees the name within seconds of a client connecting.",x:"Use WPA3 encryption for actual security. Hiding the SSID mostly just makes life annoying for legitimate users."},
{i:"s14",d:"c2d2",o:"2.4",t:"antivirus vs antimalware EDR",q:"What advantage does EDR have over traditional signature-based antivirus?",c:["It monitors behavior and endpoint telemetry to catch novel threats, and supports investigation and response","It uses less CPU","It only works offline","It replaces the firewall"],a:0,w:"Signatures cannot catch what has never been seen. EDR watches for malicious BEHAVIOR and records the chain of events.",x:"A brand new ransomware variant has no signature, but mass file encryption is a behavior EDR can flag and halt mid-run."},
{i:"s15",d:"c2d2",o:"2.3",t:"zero-day exploit",q:"What is a zero-day vulnerability?",c:["A flaw exploited before the vendor has released a patch","A virus that activates at midnight","An expired certificate","A password that never expires"],a:0,w:"Zero-day means zero days of patch availability. Defenses fall back to behavioral detection, segmentation, and least privilege.",x:"When a zero-day drops, the interim answer is usually a vendor workaround — disable the affected feature or block the port until the patch ships."},
{i:"s16",d:"c2d2",o:"2.2",t:"single sign-on SSO",q:"What does single sign-on provide?",c:["One authentication event grants access to multiple applications","Two factors of authentication","Encrypted passwords at rest","Automatic password rotation"],a:0,w:"SSO improves user experience and centralizes control, but it also concentrates risk on that one identity.",x:"Because SSO makes one credential very valuable, it should always be paired with MFA."},
{i:"s17",d:"c2d2",o:"2.1",t:"access control list ACL",q:"Which access control model assigns permissions based on a user's job function rather than to individuals?",c:["Role-based access control (RBAC)","Discretionary access control","Mandatory access control","Rule-based access control"],a:0,w:"RBAC attaches rights to roles, then assigns people to roles. Onboarding and offboarding become one change.",x:"Move someone from Accounting to Sales and you swap their role. You do not audit forty individual folder ACLs."},
{i:"s18",d:"c2d2",o:"2.4",t:"browser security certificate warning",q:"A user gets 'Your connection is not private' on an internal site. Which cause is most likely?",c:["The certificate is expired, self-signed, or the name does not match — or the PC clock is wrong","The site uses HTTPS","The browser needs reinstalling","The user's password expired"],a:0,w:"Cert errors come down to trust chain, validity dates, or hostname mismatch. A badly wrong system clock breaks all of them at once.",x:"Check the PC's date first. A dead CMOS battery setting the clock to 2015 makes every valid certificate look expired."},
{i:"s19",d:"c2d2",o:"2.5",t:"UAC user account control",q:"What does User Account Control do in Windows?",c:["Prompts for consent or credentials before an action runs with elevated privileges","Encrypts user files","Manages Wi-Fi profiles","Backs up the registry"],a:0,w:"UAC keeps even admin accounts running with a standard token until elevation is explicitly approved.",x:"Disabling UAC because the prompts are annoying is a genuinely bad idea — it removes the last speed bump before silent installs."},
{i:"s20",d:"c2d2",o:"2.7",t:"content filtering parental controls",q:"A school must block access to specific website categories on all devices. What do they implement?",c:["Content filtering at the network edge or via DNS filtering","MAC filtering","Port forwarding","A DHCP reservation"],a:0,w:"Content filtering evaluates the destination against category policy. DNS-level filtering is a simple, effective way to do it network-wide.",x:"Pointing all DHCP clients at a filtering resolver and blocking outbound port 53 to everything else stops the easy bypass."},
{i:"s21",d:"c2d2",o:"2.3",t:"evil twin rogue access point",q:"An attacker sets up an access point broadcasting the same SSID as the corporate network in the parking lot. What is this attack?",c:["Evil twin","Bluesnarfing","DNS poisoning","SQL injection"],a:0,w:"An evil twin impersonates a legitimate SSID so clients associate to the attacker, who then intercepts the traffic.",x:"Certificate-based WPA2/3-Enterprise defeats this — the client validates the RADIUS server's cert and refuses the impostor."},
{i:"s22",d:"c2d2",o:"2.4",t:"VPN remote access",q:"What does a VPN provide for a remote worker?",c:["An encrypted tunnel over the public internet into the corporate network","Faster internet speeds","Free public Wi-Fi","Automatic malware removal"],a:0,w:"VPNs give confidentiality and integrity over untrusted networks and place the client logically on the internal network.",x:"Split tunneling sends only corporate traffic through the VPN. Full tunneling sends everything, which is safer but slower."},
{i:"s23",d:"c2d2",o:"2.6",t:"low level format vs standard format",q:"What is the difference between a quick format and a full format in Windows?",c:["Quick format only rebuilds the file system table; a full format also writes zeros over the data area and checks for bad sectors","Quick format is more secure","A full format changes the partition scheme","There is no difference"],a:0,w:"Quick format leaves the old data recoverable with forensic tools. Full format overwrites it once.",x:"For a drive leaving the company, neither is enough on its own — use a certified wipe utility or destroy the media."},
{i:"s24",d:"c2d2",o:"2.2",t:"biometric authentication",q:"Which of these is a 'something you are' authentication factor?",c:["A fingerprint scan","A smart card","A one-time code from an app","A PIN"],a:0,w:"Biometrics = something you ARE. Smart cards and tokens = something you HAVE. Passwords and PINs = something you KNOW.",x:"A fourth category, 'somewhere you are' (geolocation), sometimes appears on conditional access policies."},
{i:"s25",d:"c2d2",o:"2.3",t:"shoulder surfing",q:"An employee working on a train notices someone reading their screen. What control addresses this?",c:["A privacy screen filter","Full disk encryption","A stronger password","A VPN"],a:0,w:"Shoulder surfing is a visual attack, so the control is a visual one.",x:"Encryption and VPN protect data in storage and in transit. Neither does a thing about the guy sitting behind you."},
{i:"s26",d:"c2d2",o:"2.4",t:"spam gateway email filtering",q:"Which control blocks unwanted and malicious email before it reaches user inboxes?",c:["A spam gateway / secure email gateway","A host-based firewall","A proxy server","A load balancer"],a:0,w:"Email gateways filter on reputation, content, attachments, and authentication records (SPF, DKIM, DMARC).",x:"Combine it with user training. Filters catch most phishing; the one that gets through is caught by a person who knows what to look for."},

/* ---------- CORE 2 · 3.0 SOFTWARE TROUBLESHOOTING ---------- */
{i:"f01",d:"c2d3",o:"3.1",t:"Windows slow performance troubleshooting",q:"A Windows PC has become extremely slow. Task Manager shows disk at 100% constantly. What should you investigate first?",c:["Which process is driving disk I/O, plus available RAM and drive health","The monitor refresh rate","The keyboard driver","The BIOS version"],a:0,w:"Sustained 100% disk usually means heavy paging (not enough RAM), a failing drive, or a runaway indexer/update process.",x:"Common culprits: Windows Update, Windows Search indexing, a background antivirus scan, or a mechanical drive that should have been an SSD three years ago."},
{i:"f02",d:"c2d3",o:"3.1",t:"application crashing troubleshooting",q:"One application crashes on launch while everything else runs fine. What is the most efficient first step?",c:["Check Event Viewer for the faulting module, then repair or reinstall that application","Reinstall Windows","Replace the RAM","Reset the BIOS"],a:0,w:"An isolated failure points to that application's files or dependencies, not the OS or hardware.",x:"Event Viewer's Application log names the faulting module — often a specific DLL or a missing Visual C++ runtime you can install directly."},
{i:"f03",d:"c2d3",o:"3.1",t:"safe mode boot",q:"What is Safe Mode used for?",c:["Booting with a minimal driver and service set to isolate whether third-party software is causing a problem","Running Windows faster","Encrypting the drive","Performing a clean install"],a:0,w:"If the problem disappears in Safe Mode, it is caused by something that does not load there — a driver, a startup app, or malware.",x:"Safe Mode with Networking adds network drivers so you can download definitions or drivers while still in the minimal environment."},
{i:"f04",d:"c2d3",o:"3.2",t:"mobile app crashing troubleshooting",q:"A single app on a phone crashes repeatedly. What is the correct escalation order?",c:["Force stop, then clear cache, then clear app data, then uninstall and reinstall","Factory reset the device immediately","Replace the phone","Update the OS first"],a:0,w:"Least destructive first. Clearing data wipes app settings and local content; a factory reset wipes everything.",x:"Clearing cache is usually harmless. Clearing DATA logs the user out and deletes local app content — warn them before you tap it."},
{i:"f05",d:"c2d3",o:"3.2",t:"mobile device battery drain",q:"A phone's battery started draining unusually fast after installing several apps. What do you check first?",c:["Battery usage statistics in settings to identify which app is consuming power","Replace the battery","Factory reset","Disable Wi-Fi permanently"],a:0,w:"Both Android and iOS break down battery consumption per app. That data names the culprit directly.",x:"Also check for an app stuck requesting location constantly — GPS running in the background is one of the biggest silent drains."},
{i:"f06",d:"c2d3",o:"3.3",t:"malware removal steps order",q:"In CompTIA's malware removal procedure, what comes immediately after quarantining the infected system?",c:["Disable System Restore in Windows","Educate the end user","Run Windows Update","Re-image the machine"],a:0,w:"System Restore points can hold the malware, so they are disabled and purged before remediation, then re-enabled afterward.",x:"Full sequence: investigate and verify symptoms, quarantine, disable System Restore, remediate (update definitions, scan in safe mode), schedule scans and updates, re-enable System Restore and create a restore point, educate the user."},
{i:"f07",d:"c2d3",o:"3.3",t:"browser redirects pop-ups",q:"A user's browser opens unwanted pop-ups and redirects searches to an unfamiliar engine. What is the likely cause?",c:["A malicious browser extension or adware / browser hijacker","A failing hard drive","Insufficient RAM","An outdated BIOS"],a:0,w:"Search redirection and injected ads are classic browser hijacker behavior, usually delivered through an extension or bundled installer.",x:"Remove unknown extensions, reset the browser to defaults, check the shortcut's Target field for an appended URL, and scan with an anti-malware tool."},
{i:"f08",d:"c2d3",o:"3.3",t:"rogue antivirus fake alerts",q:"A pop-up claims the system has 47 viruses and demands payment to clean them, appearing only in the browser. What is it?",c:["A rogue antivirus scam — close the browser and do not interact with the pop-up","A legitimate Windows Defender alert","A hardware failure warning","A driver update prompt"],a:0,w:"Real antivirus never charges you inside a browser pop-up. These pages are designed to get you to install the actual malware.",x:"Do not click anything inside the window — including the X. End the browser process in Task Manager instead."},
{i:"f09",d:"c2d3",o:"3.1",t:"low memory error",q:"Windows shows 'Your computer is low on memory' and applications close on their own. What are the two fixes?",c:["Close memory-heavy processes and add physical RAM (or increase the page file as a stopgap)","Replace the CPU","Reformat the drive","Update the GPU driver"],a:0,w:"The real fix is more RAM. Growing the page file relieves the symptom at disk speed.",x:"Task Manager's Details tab sorted by Memory names the offender. A browser with 60 tabs open is often the whole story."},
{i:"f10",d:"c2d3",o:"3.2",t:"mobile OS update failed",q:"A phone will not install its OS update, reporting insufficient space, even though the update is only 3 GB and 4 GB is free. Why?",c:["The updater needs additional working space to extract and stage the update, well beyond the download size","The battery is too low","The update is corrupt","The device is too old"],a:0,w:"Updates need room for the download, the extracted payload, and rollback data — often two to three times the stated size.",x:"Clear caches, offload some photos or unused apps, then retry. Many devices also require 50%+ battery or a charger connected."},
{i:"f11",d:"c2d3",o:"3.1",t:"Windows update failure troubleshooting",q:"Windows Update keeps failing with the same error code. Which built-in step often resolves it?",c:["Run the Windows Update troubleshooter, then clear the SoftwareDistribution folder and restart the update services","Reinstall Windows","Replace the hard drive","Disable the firewall permanently"],a:0,w:"A corrupted download cache in C:\\Windows\\SoftwareDistribution is a very common cause of repeating update failures.",x:"Stop wuauserv and bits, rename SoftwareDistribution to SoftwareDistribution.old, restart the services, then retry the update."},
{i:"f12",d:"c2d3",o:"3.2",t:"mobile device unable to decrypt email",q:"A user cannot open encrypted email on their new phone. What is missing?",c:["Their private key / S-MIME certificate has not been installed on the new device","The email app needs an update","Wi-Fi is disabled","The mailbox is full"],a:0,w:"Encrypted mail can only be opened by the recipient's private key. A new device has no key until you import it.",x:"Export the certificate with its private key from the old device or the CA and import it into the new phone's keychain."},
{i:"f13",d:"c2d3",o:"3.1",t:"system instability random reboots",q:"A PC randomly reboots with no blue screen and no event log entry beyond Kernel-Power 41. Where do you look?",c:["Power delivery and heat — the PSU, connections, and cooling","The web browser","The printer driver","The DNS settings"],a:0,w:"An abrupt cut with no crash dump means the OS never got a chance to log anything. That points to power or thermal, not software.",x:"Test with a known-good PSU. Also check that the wall circuit is not overloaded and the UPS battery has not failed."},
{i:"f14",d:"c2d3",o:"3.3",t:"keylogger detection",q:"A user's account keeps getting compromised right after they change the password, from their own workstation. What should you suspect?",c:["A keylogger on the workstation","A weak password policy","A DNS misconfiguration","An expired certificate"],a:0,w:"Credentials leaking immediately after every change means they are being captured at the point of entry.",x:"Scan with a reputable anti-malware tool in safe mode, and check for unfamiliar USB devices — hardware keyloggers exist and antivirus cannot see them."},
{i:"f15",d:"c2d3",o:"3.1",t:"default application association",q:"PDFs are opening in a browser instead of the PDF reader the user wants. Where do you fix this?",c:["Settings > Apps > Default apps, and set the .pdf file association","Device Manager","Disk Management","Windows Firewall"],a:0,w:"File type associations map extensions to a default handler. Installing a new browser often silently steals them.",x:"You can also right-click the file > Open with > Choose another app > Always use this app."},
{i:"f16",d:"c2d3",o:"3.2",t:"mobile touchscreen not responding",q:"A phone's touchscreen is unresponsive in one corner only. What do you check before assuming hardware failure?",c:["Remove the case and screen protector, clean the screen, and reboot the device","Factory reset immediately","Replace the display","Update all apps"],a:0,w:"A pinching case, a bubbled protector, or moisture on the glass causes exactly this. Free to rule out, so rule it out first.",x:"If it persists with the case off after a reboot, then it is the digitizer and the display assembly gets replaced."},
{i:"f17",d:"c2d3",o:"3.3",t:"spoofed antivirus alerts on mobile",q:"An Android user sideloaded an app from a website and is now seeing ads on the home screen. What is the root cause?",c:["Installing an app from an untrusted source outside the official store","A carrier setting","A hardware defect","An expired SIM"],a:0,w:"Sideloading bypasses store review. It is the single most common route for mobile adware and malware.",x:"Uninstall the app, revoke 'install unknown apps' for the browser, and check Settings > Apps for anything with device admin rights."},
{i:"f18",d:"c2d3",o:"3.1",t:"blue screen troubleshooting stop code",q:"Windows blue-screens with DRIVER_IRQL_NOT_LESS_OR_EQUAL naming a specific .sys file. What does that tell you?",c:["The named driver is faulting — roll it back or update it","The RAM has failed","The drive is full","Windows needs reactivation"],a:0,w:"When a STOP screen names a .sys file, it is handing you the culprit directly.",x:"Boot to Safe Mode, open Device Manager, find the device that owns that driver, and use Roll Back Driver — or replace it with the vendor's current version."},
{i:"f19",d:"c2d3",o:"3.2",t:"mobile device overheating",q:"A phone gets very hot and throttles during normal use, even when idle in a pocket. What is the most likely cause?",c:["A runaway background app or process consuming CPU continuously","The screen brightness","A weak Wi-Fi signal","Too many contacts"],a:0,w:"Idle heat means something is running that should not be. Battery usage stats will show a process with abnormal foreground-equivalent time.",x:"Also check for a failing battery and for charging with a cheap non-compliant charger, both of which produce real heat."},
{i:"f20",d:"c2d3",o:"3.3",t:"unexpected data usage mobile",q:"A phone's cellular data usage tripled with no change in the user's habits. What should you check?",c:["Per-app data usage and any recently installed apps, plus whether backups switched from Wi-Fi to cellular","The screen resolution","The SIM card size","The ringtone settings"],a:0,w:"Sudden data spikes come from a new app, a misbehaving one, or a sync setting that started using cellular.",x:"Malware exfiltrating data looks exactly like this too — an unfamiliar app near the top of the data list deserves a hard look."},

/* ---------- CORE 2 · 4.0 OPERATIONAL PROCEDURES ---------- */
{i:"p01",d:"c2d4",o:"4.1",t:"documentation asset management",q:"What does an asset management database track?",c:["Inventory of hardware and software including serials, assigned users, warranties, and licenses","Only network diagrams","Employee performance","Customer complaints"],a:0,w:"Asset management answers 'what do we own, where is it, who has it, and when does support expire'.",x:"Procurement life cycle, warranty status, and assigned user are the fields the exam calls out specifically."},
{i:"p02",d:"c2d4",o:"4.2",t:"change management process",q:"Which document in a change request describes how to undo the change if it fails?",c:["The rollback plan","The risk analysis","The scope of change","The end-user acceptance"],a:0,w:"Every formal change needs a tested rollback plan approved before implementation.",x:"Change board flow: request, purpose, scope, date/time, risk analysis, plan, rollback plan, board approval, end-user acceptance."},
{i:"p03",d:"c2d4",o:"4.3",t:"backup 3-2-1 rule",q:"What does the 3-2-1 backup rule specify?",c:["Three copies of data, on two different media types, with one copy offsite","Three backups per day for two weeks with one verification","Three servers, two networks, one admin","Three full backups and two incrementals every one week"],a:0,w:"3-2-1 defends against device failure, site-wide disaster, and media-type failure at once.",x:"Two copies on two drives in the same building is not 3-2-1. A fire or ransomware takes both."},
{i:"p04",d:"c2d4",o:"4.3",t:"incremental vs differential backup",q:"What does a differential backup copy?",c:["Everything changed since the last FULL backup","Everything changed since the last backup of any type","Only files modified today","The entire drive every time"],a:0,w:"Differential grows each day but restores from just two sets: the full plus the latest differential. Incremental restores need the full plus EVERY incremental since.",x:"Incremental backs up fastest but restores slowest. Differential is the opposite trade."},
{i:"p05",d:"c2d4",o:"4.4",t:"ESD electrostatic discharge prevention",q:"Which combination best prevents ESD damage while servicing a PC?",c:["An antistatic wrist strap connected to a grounded mat, plus antistatic bags for components","Working on carpet in a dry room","Wearing rubber gloves","Holding components by the contacts"],a:0,w:"Grounding equalizes potential so no discharge occurs. Never hold a card by the gold edge contacts.",x:"As little as 100 volts can damage a component, and you cannot feel a discharge until around 3,000 volts. You will never notice the one that kills the RAM."},
{i:"p06",d:"c2d4",o:"4.4",t:"MSDS safety data sheet",q:"Where do you find handling, storage, and disposal information for a chemical like toner or a cleaning solvent?",c:["The Safety Data Sheet (SDS/MSDS)","The user manual","The warranty card","The asset database"],a:0,w:"SDS documents hazards, PPE, first aid, spill response, and disposal requirements. Workplaces must keep them accessible.",x:"Spilled toner gets vacuumed with an ESD-safe toner vacuum and cold water only — hot water fuses it to fabric permanently."},
{i:"p07",d:"c2d4",o:"4.4",t:"battery and toner disposal",q:"How should used lithium-ion batteries and toner cartridges be disposed of?",c:["Per local regulations, through certified recycling or take-back programs","In regular trash","By incineration on site","In the recycling bin with paper"],a:0,w:"Both are regulated waste. Manufacturer take-back programs are the common compliant route for toner.",x:"Batteries in landfill leach heavy metals and start fires in garbage trucks. Cell carriers and big-box electronics stores take them free."},
{i:"p08",d:"c2d4",o:"4.5",t:"professionalism customer service",q:"A customer is angry and interrupting your explanation. What is the correct response?",c:["Listen without interrupting, avoid arguing, and clarify their concern before responding","Interrupt to correct them","Put them on hold until they calm down","Explain that they caused the problem"],a:0,w:"CompTIA's professionalism objective: do not argue or be defensive, do not dismiss the problem, listen and avoid interrupting, then clarify.",x:"Also on the list: avoid jargon, avoid social media contact with customers, and never take a personal call in front of one."},
{i:"p09",d:"c2d4",o:"4.5",t:"customer confidential materials",q:"While repairing a PC you notice files that appear to document illegal activity. What do you do?",c:["Preserve the evidence, report it through your organization's chain of custody procedure, and do not investigate further yourself","Delete the files","Post about it online","Confront the customer"],a:0,w:"Your job is to identify, report through proper channels, and preserve — not to investigate or act on your own.",x:"Chain of custody documents who handled the evidence, when, and why. Break it and the evidence becomes unusable."},
{i:"p10",d:"c2d4",o:"4.6",t:"PII PCI GDPR regulated data",q:"A customer's date of birth, address, and Social Security number fall into which category?",c:["PII — personally identifiable information","PCI data","Corporate intellectual property","Public data"],a:0,w:"PII identifies an individual. PCI DSS specifically governs payment card data; PHI covers health information under HIPAA.",x:"A breach of PII triggers legal notification requirements in most jurisdictions, which is why classification matters before an incident, not after."},
{i:"p11",d:"c2d4",o:"4.2",t:"acceptable use policy",q:"Which document defines what employees may and may not do with company IT resources?",c:["Acceptable use policy (AUP)","Service level agreement","Business continuity plan","Standard operating procedure"],a:0,w:"The AUP sets the rules for company devices, networks, and data, and gives HR the basis for enforcement.",x:"An SLA is an agreement about service levels with a provider or internal customer — a different document with a different purpose."},
{i:"p12",d:"c2d4",o:"4.7",t:"remote access tools RMM",q:"Which remote access method gives a technician full desktop control of a Windows workstation over the LAN?",c:["RDP or a remote monitoring and management (RMM) agent","SSH","Telnet","FTP"],a:0,w:"RDP provides graphical control. SSH is a command-line session; Telnet is insecure command-line; FTP only moves files.",x:"RMM tools add unattended access, patching, scripting, and monitoring — which is what MSPs actually run day to day."},
{i:"p13",d:"c2d4",o:"4.1",t:"knowledge base ticketing system",q:"What information should always be captured when opening a support ticket?",c:["User information, device information, a clear problem description, category, severity, and escalation level","Only the user name","Only the error code","The technician's opinion of the user"],a:0,w:"Complete tickets make escalation and pattern analysis possible. CompTIA names these fields explicitly.",x:"Progress notes and the final resolution matter just as much — that is what turns a closed ticket into a knowledge base article."},
{i:"p14",d:"c2d4",o:"4.4",t:"electrical fire safety extinguisher",q:"Which fire extinguisher class is used on an electrical fire?",c:["Class C","Class A","Class B","Class D"],a:0,w:"Class C is for energized electrical equipment. Class A is ordinary combustibles, B is flammable liquids, D is combustible metals.",x:"Never use water (Class A) on an energized electrical fire — water conducts and you become part of the circuit."},
{i:"p15",d:"c2d4",o:"4.4",t:"proper power handling equipment grounding",q:"Which environmental control protects equipment from both electrical damage and static buildup?",c:["Proper grounding plus humidity control around 40-60%","Maximum air conditioning","Direct sunlight","Carpeted floors"],a:0,w:"Air that is too dry builds static; too humid causes condensation and corrosion. Grounding handles fault current.",x:"Server rooms target roughly 40-60% relative humidity for exactly this reason."},
{i:"p16",d:"c2d4",o:"4.8",t:"scripting use cases",q:"Which is a legitimate risk of running scripts on production systems?",c:["Inadvertently changing system settings or causing a system crash or application failure","Scripts always run slower than manual work","Scripts cannot be version controlled","Scripts require a GUI"],a:0,w:"CompTIA lists unintentionally introducing malware, inadvertently changing settings, and browser or system crashes as script risks.",x:"Test in a lab or on one machine first, and have a rollback. A loop with a wrong variable can hit every endpoint in the domain in seconds."},
{i:"p17",d:"c2d4",o:"4.8",t:"script file extensions",q:"Which file extension is a PowerShell script?",c:[".ps1",".sh",".vbs",".bat"],a:0,w:"Know the set: .ps1 PowerShell, .bat Windows batch, .vbs VBScript, .sh shell script, .py Python, .js JavaScript.",x:"PowerShell's execution policy blocks unsigned .ps1 files by default — that is why a script runs for you as admin but not for the user."},
{i:"p18",d:"c2d4",o:"4.3",t:"disaster recovery RTO RPO",q:"What does Recovery Point Objective (RPO) define?",c:["The maximum acceptable amount of data loss, measured in time","How long recovery is allowed to take","The cost of downtime per hour","The number of backup copies required"],a:0,w:"RPO = how much data you can afford to lose, which sets your backup frequency. RTO = how fast you must be back up.",x:"An RPO of one hour means backups run at least hourly. An RTO of four hours means your restore process must complete inside four hours."},
{i:"p19",d:"c2d4",o:"4.6",t:"software licensing EULA",q:"A company installs one purchased copy of an application on 40 machines. What have they violated?",c:["The software license agreement — they need per-seat or volume licensing","The acceptable use policy","GDPR","The SLA"],a:0,w:"Personal-use and single-seat licenses do not cover organizational deployment. Enterprise licensing exists for exactly this.",x:"Software audits are real and expensive. Asset management should track license counts against installed seats continuously."},
{i:"p20",d:"c2d4",o:"4.5",t:"setting expectations timeline",q:"You cannot resolve an issue during the visit. What is the professional way to close out?",c:["Set and meet clear expectations for follow-up, offer options, and document what you did","Tell the user it is unfixable","Leave without explanation","Promise a fix by tomorrow regardless"],a:0,w:"Set expectations, communicate the timeline, offer repair or replacement options, follow up, and provide proper documentation.",x:"Under-promise and over-deliver. A user told 'Thursday' who gets it Wednesday is happy; told 'tomorrow' and getting Thursday is furious."},
];

const CARDS = [

{i:"c03",d:"c1d2",t:"Telnet",b:"Remote CLI in clear text — TCP 23",x:"Never use on a production network. SSH exists."},
{i:"c04",d:"c1d2",t:"SMTP",b:"Simple Mail Transfer Protocol — TCP 25 (587 for authenticated submission with TLS)",x:"Outbound mail only. Receiving is IMAP or POP3."},
{i:"c05",d:"c1d2",t:"DNS",b:"Domain Name System — UDP/TCP 53",x:"Resolves names to IPs. Broken DNS = IP works, hostname does not."},
{i:"c06",d:"c1d2",t:"DHCP",b:"Dynamic Host Configuration Protocol — UDP 67 (server) and 68 (client)",x:"DORA: Discover, Offer, Request, Acknowledge."},
{i:"c07",d:"c1d2",t:"TFTP",b:"Trivial FTP — UDP 69",x:"No authentication. Used for network device firmware and PXE boot."},
{i:"c08",d:"c1d2",t:"HTTP / HTTPS",b:"TCP 80 / TCP 443",x:"443 also carries most VPN and API traffic because it is almost never blocked."},
{i:"c09",d:"c1d2",t:"POP3 / IMAP",b:"POP3 TCP 110 (995 secure); IMAP TCP 143 (993 secure)",x:"IMAP syncs across devices; POP3 traditionally downloads and deletes."},
{i:"c10",d:"c1d2",t:"NetBIOS / NetBT",b:"TCP/UDP 137, 138, 139",x:"Legacy Windows name service. Modern SMB uses 445 directly."},
{i:"c11",d:"c1d2",t:"SNMP",b:"Simple Network Management Protocol — UDP 161 (queries), 162 (traps)",x:"Use v3 — v1 and v2c send community strings in clear text."},
{i:"c12",d:"c1d2",t:"LDAP / LDAPS",b:"TCP 389 / TCP 636",x:"Directory lookups against Active Directory and other directory services."},
{i:"c13",d:"c1d2",t:"SMB / CIFS",b:"TCP 445",x:"Windows file and printer sharing. Block it at the internet edge."},
{i:"c14",d:"c1d2",t:"RDP",b:"Remote Desktop Protocol — TCP 3389",x:"Put it behind a VPN. Exposed RDP is a top ransomware entry point."},
{i:"c15",d:"c1d3",t:"RAID 0",b:"Striping. Speed and full capacity, zero redundancy.",x:"One drive dies, the whole array dies."},
{i:"c16",d:"c1d3",t:"RAID 1",b:"Mirroring. Identical copy on two drives; you get half the raw capacity.",x:"Survives one drive failure. Fast reads, no write speed gain."},
{i:"c17",d:"c1d3",t:"RAID 5",b:"Striping with distributed parity, 3+ drives. Survives one failure.",x:"Usable capacity = (n-1) drives. Rebuilds are slow and stressful on big disks."},
{i:"c18",d:"c1d3",t:"RAID 6",b:"Striping with double distributed parity, 4+ drives. Survives two failures.",x:"Usable capacity = (n-2). The answer for large-capacity arrays."},
{i:"c19",d:"c1d3",t:"RAID 10",b:"Mirrored sets that are then striped. 4+ drives, half capacity.",x:"Best performance plus redundancy. What you put a database on."},

{i:"c21",d:"c1d3",t:"M.2 2280",b:"An M.2 module 22 mm wide by 80 mm long",x:"Sizing is always width then length. 2230 is the short one, 22110 the long one."},

{i:"c24",d:"c1d3",t:"Laser printing steps",b:"Processing, Charging, Exposing, Developing, Transferring, Fusing, Cleaning",x:"Mnemonic: Please Come Every Day To Fix Computers."},

{i:"c26",d:"c1d3",t:"TDP",b:"Thermal Design Power — the heat a cooler must dissipate, in watts",x:"Match your cooler's rating to the CPU TDP or you throttle under load."},
{i:"c27",d:"c1d1",t:"NFC",b:"Near Field Communication — roughly 4 cm range",x:"Tap to pay. The tiny range IS part of the security model."},

{i:"c29",d:"c1d4",t:"IaaS / PaaS / SaaS",b:"Infrastructure / Platform / Software as a Service",x:"EC2 is IaaS, Heroku is PaaS, Gmail is SaaS."},
{i:"c30",d:"c1d4",t:"Type 1 hypervisor",b:"Bare-metal — runs directly on hardware with no host OS",x:"ESXi, Hyper-V, Proxmox. Type 2 (VirtualBox) runs as an app on a host OS."},
{i:"c31",d:"c1d4",t:"VDI",b:"Virtual Desktop Infrastructure — desktops hosted centrally, accessed from thin clients",x:"No data on the endpoint, so a dead thin client is a five-minute swap."},

{i:"c33",d:"c1d5",t:"APIPA",b:"Automatic Private IP Addressing — 169.254.x.x with mask 255.255.0.0",x:"Means the client never got a DHCP lease."},

<script>
/* ============================================================

const LS_KEY = "benchtest.state.v1";
const DB_PATH = "state/main";
const RANKS = [
  [0,  "Cold Boot",        "Nothing logged yet. Run a drill and let's get a baseline."],
  [15, "Cable Monkey",     "You know which end plugs in. Keep going."],
  [30, "Tier 1",           "You can close easy tickets. The hard domains are still soft."],
  [45, "Field Tech",       "Solid working knowledge. Weak spots are what's holding the score down."],
  [60, "Bench Certified",  "You'd survive a real bench. Not exam-safe yet."],
  [72, "Senior Tech",      "Strong. Tighten the last two or three domains."],
  [84, "Exam Ready",       "This is passing territory. Run full timed sims now."],
  [93, "Overqualified",    "You're teaching this at this point. Go book the test."]
];
const LEITNER = [0, 1, 3, 7, 21];
const CARD_TAB_KEY = "cards";

let S = null, DB = null, saveTimer = null, tick = null, ui = {};

/* ---------- state ---------- */
function blankState(){
  const id = "sem" + Date.now();
  return {
    v:1, updatedAt: Date.now(),
    profile:{ examDate:null, dailyGoal:20, focus:"both", theme:"auto" },
    mastery:{}, cards:{}, days:{}, streak:{n:0,last:null},
    semesters:[{ id, name:"Semester 1", start: todayKey(), end:null, dom:{}, tot:{c:0,w:0} }],
    cur:id, exam:null, bestSpeed:0
  };
}
function todayKey(d){ const t = d||new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function dayNum(k){ const [y,m,d]=k.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); }

function mergeState(a,b){
  if(!a) return b; if(!b) return a;
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b, older = newer===a?b:a;
  const out = JSON.parse(JSON.stringify(newer));
  // mastery: keep whichever entry has more attempts
  for(const k in older.mastery||{}){
    const o = older.mastery[k], n = out.mastery[k];
    if(!n || (o.c+o.w) > (n.c+n.w)) out.mastery[k] = o;
  }
  for(const k in older.cards||{}){
    const o = older.cards[k], n = out.cards[k];
    if(!n || (o.reps||0) > (n.reps||0)) out.cards[k] = o;
  }
  for(const k in older.days||{}){
    const o = older.days[k], n = out.days[k];
    if(!n || o.a > n.a) out.days[k] = o;
  }
  const byId = {}; (out.semesters||[]).forEach(s=>byId[s.id]=s);
  (older.semesters||[]).forEach(s=>{
    const e = byId[s.id];
    if(!e){ out.semesters.push(s); }
    else if((s.tot.c+s.tot.w) > (e.tot.c+e.tot.w)){ Object.assign(e, s); }
  });
  out.bestSpeed = Math.max(out.bestSpeed||0, older.bestSpeed||0);
  if((older.streak?.n||0) > (out.streak?.n||0)) out.streak = older.streak;
  return out;
}
function loadLocal(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updatedAt = Date.now(); saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ if(DB) DB.doc(DB_PATH).set(S).catch(()=>{}); }, 700);
}

/* ---------- scoring ---------- */
function activeDomains(){
  const f = S.profile.focus;
  return DOMAINS.filter(d => f==="both" || (f==="c1"&&d.core===1) || (f==="c2"&&d.core===2));
}
function qsIn(k){ return QUESTIONS.filter(q=>q.d===k); }
function domainStat(k){
  const all = qsIn(k); let c=0,w=0,seen=0;
  all.forEach(q=>{ const m=S.mastery[q.i]; if(m){ seen++; c+=m.c; w+=m.w; } });
  const att = c+w;
  const acc = att ? c/att : 0;
  const cov = all.length ? Math.min(1, seen/all.length) : 0;
  return { total:all.length, seen, c, w, att, acc, cov, ready: acc*cov };
}
function readiness(){
  const ds = activeDomains(); if(!ds.length) return 0;
  let num=0, den=0;
  const perCore = {};
  ds.forEach(d=>{ perCore[d.core]=(perCore[d.core]||0)+d.w; });
  const cores = Object.keys(perCore).length;
  ds.forEach(d=>{
    const share = (d.w/perCore[d.core])/cores;
    num += share * domainStat(d.k).ready; den += share;
  });
  return den ? Math.round(100*num/den) : 0;
}
function rankFor(p){ let r=RANKS[0]; for(const x of RANKS) if(p>=x[0]) r=x; return r; }
function totals(){
  let c=0,w=0; for(const k in S.mastery){ c+=S.mastery[k].c; w+=S.mastery[k].w; } return {c,w};
}
function curSem(){ return S.semesters.find(s=>s.id===S.cur) || S.semesters[S.semesters.length-1]; }
function missedIds(){ return Object.keys(S.mastery).filter(k=>S.mastery[k].lastWrong && QUESTIONS.some(q=>q.i===k)); }
function dueCards(){
  const t = dayNum(todayKey());
  return CARDS.filter(c=>{ const m=S.cards[c.i]; return !m || (m.due||0) <= t; });
}
function daysUntilExam(){
  if(!S.profile.examDate) return null;
  return Math.ceil((new Date(S.profile.examDate+"T00:00:00") - new Date(todayKey()+"T00:00:00"))/864e5);
}

/* ---------- recording ---------- */
function recordAnswer(q, correct){
  const m = S.mastery[q.i] || {c:0,w:0};
  if(correct){ m.c++; m.lastWrong=false; } else { m.w++; m.lastWrong=true; }
  m.seen = Date.now(); S.mastery[q.i] = m;

  const dk = todayKey(), day = S.days[dk] || {a:0,c:0};
  day.a++; if(correct) day.c++; S.days[dk] = day;

  if(S.streak.last !== dk){
    const gap = S.streak.last ? dayNum(dk)-dayNum(S.streak.last) : 99;
    S.streak.n = gap===1 ? S.streak.n+1 : 1;
    S.streak.last = dk;
  }
  const sem = curSem();
  if(sem){
    sem.dom[q.d] = sem.dom[q.d] || {c:0,w:0};
    sem.dom[q.d][correct?"c":"w"]++;
    sem.tot[correct?"c":"w"]++;
  }
  save();
}

/* ---------- question selection ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pool(){ const ks = activeDomains().map(d=>d.k); return QUESTIONS.filter(q=>ks.includes(q.d)); }
function smartPick(n, src){
  const list = src || pool();
  const scored = list.map(q=>{
    const m = S.mastery[q.i];
    let s = Math.random();
    if(!m) s += 1.4;                         // never seen
    else {
      if(m.lastWrong) s += 1.9;              // missed last time
      const acc = m.c/(m.c+m.w);
      s += (1-acc) * 1.1;
      s -= Math.min(0.7, m.c*0.18);          // stop grinding what you know
    }
    s += (1 - domainStat(q.d).ready) * 0.9;  // weak domain boost
    return {q, s};
  });
  scored.sort((a,b)=>b.s-a.s);
  return shuffle(scored.slice(0, Math.min(n*2, scored.length))).slice(0,n).map(x=>x.q);
}
function examPick(n, core){
  const ds = DOMAINS.filter(d=>core?d.core===core:true);
  const totalW = ds.reduce((a,d)=>a+d.w,0);
  let out = [];
  ds.forEach(d=>{
    const want = Math.round(n * d.w/totalW);
    out = out.concat(shuffle(qsIn(d.k)).slice(0, want));
  });
  const rest = shuffle(QUESTIONS.filter(q=>ds.some(d=>d.k===q.d) && !out.includes(q)));
  while(out.length < n && rest.length) out.push(rest.pop());
  return shuffle(out).slice(0,n);
}
function videoURL(q){
  const t = encodeURIComponent("Professor Messer " + (q.core===2?"220-1202":"220-1201") + " " + (q.t||""));
  return "https://www.youtube.com/results?search_query=" + t;
}
function domainOf(k){ return DOMAINS.find(d=>d.k===k); }

/* ---------- tiny dom helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function el(html){ const t=document.createElement("div"); t.innerHTML=html.trim(); return t.firstElementChild; }
function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const t = el('<div class="toast">'+esc(msg)+'</div>'); document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2100);
}
function ring(pct, size, stroke, color){
  const r = (size-stroke)/2, cir = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surf3)" stroke-width="'+stroke+'"></circle>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+
    '" stroke-linecap="round" stroke-dasharray="'+cir+'" stroke-dashoffset="'+(cir*(1-pct/100))+'"></circle></svg>';
}
function meterColor(p){ return p>=75?"var(--ok)": p>=45?"var(--gold)":"var(--bad)"; }

const TABS = [

function statusView(){
  const p = readiness(), rank = rankFor(p), t = totals();
  const ratio = t.w ? (t.c/t.w).toFixed(2) : (t.c ? "∞" : "—");
  const dk = todayKey(), today = S.days[dk] || {a:0,c:0};
  const goal = S.profile.dailyGoal;

  const untouched = ds.filter(x=>x.st.att===0);

  wrap.appendChild(el(
    '<div class="readout">'+
      '<div class="readout-top">'+

    '</div>'

  if(t.c+t.w > 0){
    const wpct = Math.round(100*t.c/(t.c+t.w));
    wrap.appendChild(el(
      '<div class="card"><div class="sec-h"><h2>Lifetime accuracy</h2><span class="mono" style="font-size:13px;color:'+meterColor(wpct)+'">'+wpct+'%</span></div>'+
      '<div class="wl"><i class="w" style="width:'+wpct+'%"></i><i class="l" style="width:'+(100-wpct)+'%"></i></div>'+
      '<div class="row" style="margin-top:9px;justify-content:space-between"><span class="eyebrow" style="color:var(--ok)">'+t.c+' correct</span>'+

    ));
  }

  // today + countdown
  const cd = el('<div class="card"></div>');
  cd.innerHTML =
    '<div class="sec-h"><h2>Today</h2><span class="mono" style="font-size:12px;color:var(--ink3)">'+today.a+' / '+goal+' questions</span></div>'+
    '<div class="meter-track"><div class="meter-fill" style="width:'+goalPct+'%;background:'+(goalPct>=100?"var(--ok)":"var(--gold)")+'"></div></div>'+
    '<div class="row" style="margin-top:11px;gap:9px">'+
      '<button class="btn primary grow" id="goDrill">'+(today.a?"Keep drilling":"Start today's drill")+'</button>'+

    '</div>'+
    (dLeft!==null ? '<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line);justify-content:space-between">'+
      '<span class="eyebrow">Exam day</span><span class="mono" style="font-size:13px;color:'+(dLeft<=14?"var(--bad)":"var(--gold)")+'">'+
      (dLeft>0? dLeft+" days out" : dLeft===0 ? "TODAY — go get it" : "passed")+'</span></div>' : '');
  wrap.appendChild(cd);

  // domain readout
  const dv = el('<div class="card"><div class="sec-h"><h2>Domain readout</h2><span class="eyebrow">Accuracy × coverage</span></div></div>');
  ds.forEach(({d,st})=>{
    const r = Math.round(st.ready*100);
    dv.appendChild(el(
      '<div class="meter"'+(st.att?'':' style="padding:8px 0"')+'>'+
        '<div class="meter-name"><span class="dot" style="background:'+d.c+'"></span>'+
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.n)+'</span>'+
          '<em>C'+d.core+' '+d.o+'</em></div>'+
        '<div class="meter-pct"'+(st.att?'':' style="color:var(--ink3);font-size:11px;letter-spacing:.08em;text-transform:uppercase"')+'>'+
          (st.att ? r+'%' : 'untouched')+'</div>'+
        '<div class="meter-track"><div class="meter-fill" style="width:'+r+'%;background:'+meterColor(r)+'"></div></div>'+
        (st.att ? '<div class="meter-note">'+Math.round(st.acc*100)+'% correct · '+st.seen+'/'+st.total+' questions seen</div>' : '')+
      '</div>'
    ));
  });
  wrap.appendChild(dv);

  // weak spots
  if(weak.length || untouched.length){
    const ws = el('<div class="card"><div class="sec-h"><h2>Where you\'re losing points</h2></div><div class="stack" style="gap:8px"></div></div>');
    const body = ws.querySelector(".stack");
    weak.forEach(({d,st})=>{
      const r = Math.round(st.ready*100);
      const row = el('<div class="rec"><div class="rec-i" style="background:'+d.c+';color:#0d1117">'+d.o[0]+'</div>'+
        '<div class="grow"><b>'+esc(d.n)+'</b> — '+Math.round(st.acc*100)+'% correct over '+st.att+' attempts. '+
        'That domain is '+d.w+'% of '+CORE_INFO[d.core].name+'.</div></div>');
      const b = el('<button class="btn sm">Drill</button>'); b.onclick=()=>startQuiz({label:d.n, src:qsIn(d.k), n:10});
      row.appendChild(b); body.appendChild(row);
    });
    if(untouched.length){
      const first = untouched.slice(0,3).map(x=>x.d.n).join(", ");
      const more = untouched.length>3 ? ", and "+(untouched.length-3)+" more" : "";
      const heaviest = untouched.slice().sort((a,b)=>b.d.w-a.d.w)[0].d;
      const row = el('<div class="rec"><div class="rec-i" style="background:var(--surf3);color:var(--ink2)">?</div>'+
        '<div class="grow"><b>'+untouched.length+' domain'+(untouched.length>1?'s':'')+' untouched</b> — '+
        esc(first)+esc(more)+'. Zero coverage caps your readiness no matter how good your accuracy is. '+
        'Start with <b>'+esc(heaviest.n)+'</b>, it is the heaviest of them at '+heaviest.w+'%.</div></div>');
      const b = el('<button class="btn sm">Start</button>');
      b.onclick=()=>startQuiz({label:heaviest.n, src:qsIn(heaviest.k), n:10});
      row.appendChild(b); body.appendChild(row);
    }
    wrap.appendChild(ws);
  }

  setTimeout(()=>{
    const a = document.getElementById("goDrill"); if(a) a.onclick=()=>startQuiz({label:"Smart mix", n:10});
    const b = document.getElementById("goCards"); if(b) b.onclick=()=>go(CARD_TAB_KEY);
  },0);
  return wrap;
}

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
let quiz = null;
function startQuiz(opts){
  const src = opts.src && opts.src.length ? opts.src : pool();
  const qs = opts.shuffled ? shuffle(src).slice(0,opts.n) : smartPick(Math.min(opts.n, src.length), src);
  if(!qs.length){ toast("No questions in that set"); return; }
  quiz = { label:opts.label, src:opts.src||null, qs, i:0, answered:null, right:0, wrong:0, log:[] };
  go(route, "quiz");
}
function quizView(){
  const q = quiz.qs[quiz.i], d = domainOf(q.d);
  const wrap = el('<div></div>');
  wrap.appendChild(el(
    '<div class="qbar"><button class="icobtn" id="qx" aria-label="Exit drill">✕</button>'+
    '<div class="qprog"><i style="width:'+(100*quiz.i/quiz.qs.length)+'%"></i></div>'+
    '<span class="mono" style="font-size:12.5px;color:var(--ink2)">'+(quiz.i+1)+'/'+quiz.qs.length+'</span></div>'
  ));
  wrap.appendChild(el('<div class="qmeta"><span class="pill gold">'+esc(quiz.label)+'</span>'+
    '<span class="pill">'+esc(d.n)+'</span><span class="pill">'+CORE_INFO[d.core].code+' · '+q.o+'</span></div>'));
  wrap.appendChild(el('<p class="qtext">'+esc(q.q)+'</p>'));

  const order = quiz.order || (quiz.order = shuffle(q.c.map((_,i)=>i)));
  const opts = el('<div class="opts"></div>');
  order.forEach((oi,pos)=>{
    const b = el('<button class="opt"><span class="key">'+"ABCD"[pos]+'</span><span>'+esc(q.c[oi])+'</span></button>');
    b.onclick = ()=>answer(oi);
    opts.appendChild(b);
  });
  wrap.appendChild(opts);

  if(quiz.answered !== null){
    const right = quiz.answered === q.a;
    opts.querySelectorAll(".opt").forEach((b,pos)=>{
      const oi = order[pos]; b.disabled = true;
      if(oi === q.a) b.classList.add("correct");
      else if(oi === quiz.answered) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const v = el('<div class="verdict '+(right?"good":"bad")+'">'+
      '<h3>'+(right?'<span style="color:var(--ok)">✓ Correct</span>':'<span style="color:var(--bad)">✗ Not quite</span>')+'</h3>'+
      '<p>'+esc(q.w)+'</p>'+
      '<div class="ex"><b>In practice:</b> '+esc(q.x)+'</div>'+
      '<a class="watch" target="_blank" rel="noopener" href="'+videoURL(Object.assign({core:d.core},q))+'">▶ Watch a video on '+esc(q.t)+'</a>'+
      '</div>');
    const next = el('<button class="btn primary wide" style="margin-top:13px">'+(quiz.i+1<quiz.qs.length?"Next question":"See results")+'</button>');
    next.onclick = ()=>{
      quiz.answered=null; quiz.order=null; quiz.i++;
      if(quiz.i >= quiz.qs.length) go(route,"quizdone"); else render();
    };
    wrap.appendChild(v); wrap.appendChild(next);
  }
  setTimeout(()=>{ const x=document.getElementById("qx"); if(x) x.onclick=()=>{ sub=null; render(); }; },0);
  return wrap;
}
function answer(oi){
  if(quiz.answered !== null) return;
  const q = quiz.qs[quiz.i], right = oi === q.a;
  quiz.answered = oi; right ? quiz.right++ : quiz.wrong++;
  quiz.log.push({q, right});
  recordAnswer(q, right);
  render();
}
function quizDoneView(){
  const pct = Math.round(100*quiz.right/quiz.qs.length);
  const wrap = el('<div class="stack"></div>');
  wrap.appendChild(el('<div class="card" style="text-align:center;padding:26px 16px">'+
    '<div class="eyebrow">'+esc(quiz.label)+' complete</div>'+
    '<div class="score-big" style="color:'+meterColor(pct)+';margin:8px 0 4px">'+pct+'%</div>'+
    '<div class="mono" style="font-size:13px;color:var(--ink2)">'+quiz.right+' right · '+quiz.wrong+' wrong</div></div>'));

  if(quiz.wrong){
    const rv = el('<div class="card"><div class="sec-h"><h2>What you missed</h2></div><div class="stack" style="gap:9px"></div></div>');
    const b = rv.querySelector(".stack");
    quiz.log.filter(l=>!l.right).forEach(l=>{
      b.appendChild(el('<div class="rec"><div class="rec-i" style="background:var(--bad-dim);color:var(--bad)">✗</div>'+
        '<div class="grow"><b>'+esc(l.q.q)+'</b><br>Answer: '+esc(l.q.c[l.q.a])+'</div></div>'));
    });
    wrap.appendChild(rv);
  }
  const row = el('<div class="btnrow"></div>');
  const again = el('<button class="btn primary grow">Another '+quiz.qs.length+'</button>');
  again.onclick = ()=>startQuiz({label:quiz.label, src:quiz.src, n:quiz.qs.length});
  const done = el('<button class="btn">Done</button>');
  done.onclick = ()=>{ sub=null; go("status"); };
  row.appendChild(again); row.appendChild(done); wrap.appendChild(row);
  return wrap;
}

/* ============================================================
   PBQ ENGINE
   ============================================================ */
let pbq = null;
function startPBQ(p){
  const slots = p.kind==="order"
    ? p.items.map((v,i)=>({label:"", answer:v}))
    : p.slots.map(([l,a])=>({label:l, answer:a}));
  pbq = { p, slots, filled: slots.map(()=>null), poolItems: shuffle(slots.map(s=>s.answer)), armed:null, checked:false };
  go(route, "pbq");
}
function pbqView(){
  const {p, slots, filled, poolItems, armed, checked} = pbq;
  const wrap = el('<div></div>');
  wrap.appendChild(el('<div class="qbar"><button class="icobtn" id="px" aria-label="Exit">✕</button>'+
    '<div class="grow"><b style="font-family:\'IBM Plex Sans Condensed\',sans-serif;font-size:16px">'+esc(p.title)+'</b></div>'+
    '<span class="pill">'+esc(p.kind==="order"?"Sequence":"Match")+'</span></div>'));
  wrap.appendChild(el('<p style="font-size:14px;color:var(--ink2);margin:0 0 13px;line-height:1.5">'+esc(p.prompt)+
    (checked?'':' <span style="color:var(--ink3)">Tap an item, then tap where it goes.</span>')+'</p>'));

  const poolBox = el('<div class="pbq-pool" style="margin-bottom:13px"></div>');
  const remaining = poolItems.filter(v=>!filled.includes(v));
  if(!remaining.length) poolBox.appendChild(el('<span style="font-size:12px;color:var(--ink3);padding:4px">All placed — hit Check.</span>'));
  remaining.forEach(v=>{
    const c = el('<button class="chipdrag'+(armed===v?" picked":"")+'">'+esc(v)+'</button>');
    c.onclick = ()=>{ if(checked) return; pbq.armed = (armed===v?null:v); render(); };
    poolBox.appendChild(c);
  });
  wrap.appendChild(poolBox);

  const slotBox = el('<div class="stack" style="gap:7px"></div>');
  slots.forEach((s,i)=>{
    let cls = "slot";
    if(checked) cls += (filled[i]===s.answer ? " right" : " wrongslot");
    else if(armed) cls += " armed";
    const row = el('<div class="'+cls+'"></div>');
    if(p.kind==="order") row.appendChild(el('<span class="slot-n">'+(i+1)+'</span>'));
    else row.appendChild(el('<span class="slot-label">'+esc(s.label)+'</span>'));
    row.appendChild(el('<span class="slot-val grow"'+(p.kind==="match"?' style="text-align:right"':'')+'>'+
      (filled[i]? esc(filled[i]) : '<span style="color:var(--ink3);font-size:12.5px">—</span>')+'</span>'));
    if(checked && filled[i]!==s.answer) row.appendChild(el('<span class="mono" style="font-size:11px;color:var(--ok);flex:none">'+esc(s.answer)+'</span>'));
    row.onclick = ()=>{
      if(checked) return;
      if(filled[i]){ pbq.filled[i]=null; render(); return; }
      if(armed){ pbq.filled[i]=armed; pbq.armed=null; render(); }
    };
    slotBox.appendChild(row);
  });
  wrap.appendChild(slotBox);

  if(!checked){
    const b = el('<button class="btn primary wide" style="margin-top:14px"'+(filled.includes(null)?" disabled":"")+'>Check answers</button>');
    b.onclick = ()=>{
      pbq.checked = true;
      const got = filled.filter((v,i)=>v===slots[i].answer).length;
      recordAnswer({i:"PBQ:"+p.i, d:p.d}, got===slots.length);
      render();
    };
    wrap.appendChild(b);
  } else {
    const got = filled.filter((v,i)=>v===slots[i].answer).length, all = got===slots.length;
    wrap.appendChild(el('<div class="verdict '+(all?"good":"bad")+'" style="margin-top:14px">'+
      '<h3>'+(all?'<span style="color:var(--ok)">✓ All correct</span>':'<span style="color:var(--bad)">'+got+' of '+slots.length+' correct</span>')+'</h3>'+
      '<p>'+esc(p.why)+'</p></div>'));
    const row = el('<div class="btnrow" style="margin-top:12px"></div>');
    const retry = el('<button class="btn primary grow">Try again</button>'); retry.onclick=()=>startPBQ(p);
    const back = el('<button class="btn">Back</button>'); back.onclick=()=>{ sub=null; go("drill"); };
    row.appendChild(retry); row.appendChild(back); wrap.appendChild(row);
  }
  setTimeout(()=>{ const x=document.getElementById("px"); if(x) x.onclick=()=>{ sub=null; go("drill"); }; },0);
  return wrap;
}

  const it = speed.items[speed.i % speed.items.length];
  if(!speed.choices || speed.forIdx !== speed.i){
    const others = shuffle(SPEED.filter(s=>s.a!==it.a)).slice(0,3).map(s=>s.a);
    speed.choices = shuffle([it.a, ...others]); speed.forIdx = speed.i;
  }
  wrap.appendChild(el('<div class="qbar"><button class="icobtn" id="sx" aria-label="Exit">✕</button>'+
    '<div class="grow"><span class="eyebrow">Score</span> <b class="mono" style="font-size:16px">'+speed.score+'</b></div>'+
    '<span class="mono" id="spClock" style="font-size:17px;font-weight:600;color:'+(speed.left<=10?"var(--bad)":"var(--gold)")+'">0:'+String(speed.left).padStart(2,"0")+'</span></div>'));
  wrap.appendChild(el('<div class="speed-term" style="text-align:center">'+esc(it.q)+'</div>'));
  wrap.appendChild(el('<p style="text-align:center;font-size:12px;color:var(--ink3);margin:0 0 16px">'+
    (/^\d/.test(it.a)||it.a.includes("/")&&it.a.length<8 ? "port number?" : "what does it stand for?")+'</p>'));
  const opts = el('<div class="opts"></div>');
  speed.choices.forEach(v=>{
    const b = el('<button class="opt'+(speed.answered? (v===it.a?" correct":(v===speed.answered?" wrong":" dim")) : "")+'"><span>'+esc(v)+'</span></button>');
    b.onclick = ()=>{
      if(speed.answered) return;
      speed.answered = v;
      if(v===it.a) speed.score++;
      render();
      setTimeout(()=>{ if(!speed) return; speed.answered=null; speed.i++; render(); }, v===it.a?260:900);
    };
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
  setTimeout(()=>{ const x=document.getElementById("sx"); if(x) x.onclick=()=>{ stopClocks(); speed=null; sub=null; go("cards"); }; },0);
  return wrap;
}
function startSpeedClock(){
  stopClocks();

    speed.left--;

function examRunView(){
